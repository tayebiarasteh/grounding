retriever:
  model_name: BAAI/bge-base-en-v1.5
  tied_encoders: true
  pooling: mean
  max_query_tokens: 128
  max_doc_tokens: 256
  temperature: 0.05
  bm25_pool_size: 80
  num_hard_negatives: 8


Verifier:
  model_name: microsoft/deberta-v3-large
  max_tokens: 1024
  use_amp: true
  amp_dtype: bf16      # bf16 is fastest+stable on modern GPUs
  grad_scaler_mode: auto    # auto enables scaler only for fp16
  tf32: true


Network:
  seed: 13
  num_epochs: 40
#  batch_size: 16
  batch_size: 1
  lr: 1e-5
  weight_decay: 0.01
  grad_clip_norm: 1.0


Preprocessing:
  tokenizer_name: BAAI/bge-base-en-v1.5
  base_path_mimicData: /PATH/Text_only
  mimic_reports_base: /PATH/XRay/MIMIC
  snapshot_name: RadiopaediaSnapshot_01_03_2026
  base_path_evidenceData: /PATH/Articles_Processed_March_2026/RadiopaediaSnapshot_01_03_2026

runtime:
  use_amp: true # useful for speed

network_output_path: network_data/
output_data_path: output_data/
tb_logs_path: tensor_board_logs/
stat_log_path: stat_logs
checkpoint_name: checkpoint.tar
trained_model_name: trained_model.pth
hf_login: "xxxxxxxxxxx"


# changeable items:
target_dir: /PATH/grounding/
display_stats_freq: 1 # valid freq is equal to this
